name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    # The app runs on Windows only (Win32 window focusing, PowerShell process probe).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Corepack provides the pnpm version pinned in `packageManager`.
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
