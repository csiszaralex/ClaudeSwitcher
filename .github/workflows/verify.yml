name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    # The app runs on Windows only (Win32 window focusing, PowerShell process probe).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # Node.js, pnpm and the dependencies: `.github/actions/setup`.
      - uses: ./.github/actions/setup
      - run: pnpm verify
