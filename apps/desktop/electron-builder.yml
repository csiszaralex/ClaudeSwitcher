appId: com.claudeswitcher.desktop
productName: ClaudeSwitcher
directories:
  output: release
  # `build/` is gitignored, so resources live in `resources/`.
  buildResources: resources
files:
  - out/**
  - package.json
  # Already bundled into out/main (BUNDLED_WORKSPACE_PACKAGES in electron.vite.config.ts).
  - '!node_modules/@claudeswitcher/**'
# The tray icons, read through `resourcesDir` (src/main/resources.ts).
extraResources:
  - from: resources
    to: icons
    filter:
      - tray*.png
# The update source of `electron-updater`: the build writes `app-update.yml` into the app and
# `latest.yml` next to the installer. The `dist` script passes `--publish never`: CI uploads the
# files to the GitHub Release itself (`.github/workflows/release.yml`).
publish:
  provider: github
  owner: csiszaralex
  repo: ClaudeSwitcher
# Reuse the binary `install-electron` already fetched instead of downloading it again.
electronDist: node_modules/electron/dist
win:
  target: nsis
  icon: resources/icon.png
nsis:
  # No spaces: `latest.yml` names the installer with hyphens, and GitHub turns spaces in an uploaded
  # asset name into dots, so the default "ClaudeSwitcher Setup <version>.exe" could not be found.
  artifactName: ${productName}-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: false
  deleteAppDataOnUninstall: false
  # The shortcut page, the shortcuts themselves and the clean quit live here.
  include: resources/installer.nsh
  # installer.nsh creates the shortcuts the user chose, so the template must not.
  createDesktopShortcut: false
  createStartMenuShortcut: false
  runAfterFinish: true
